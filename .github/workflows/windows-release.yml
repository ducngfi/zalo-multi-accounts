# Tests, builds and packages the Windows app on a GitHub Windows machine with windows\scripts\release.ps1,
# and adds the installer, zip and checksums to the release v<version>, next to the macOS files.
#   Push a tag v<version>           happens on its own when macos/README.md's gh release create makes the
#                                   release; the version must match windows/Directory.Build.props and
#                                   macos/scripts/build.sh. With no release for the tag yet, makes a draft
#   Run it by hand                  Actions → Windows release → Run workflow: builds the chosen branch; with
#                                   a tag (v1.2.0), also adds the files to that tag's release
name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release to add the Windows files to, e.g. v1.2.0 (empty: only build)'
        required: false
        default: ''

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Check the tag matches the versions
        if: env.TAG != ''
        run: |
          $windows = ([xml](Get-Content windows\Directory.Build.props)).Project.PropertyGroup.Version
          $macos = (Select-String -Path macos\scripts\build.sh -Pattern '^VERSION="(.+?)"').Matches[0].Groups[1].Value
          if ($env:TAG -ne "v$windows" -or $env:TAG -ne "v$macos") {
            throw "Tag $env:TAG must match both versions: Windows $windows (windows\Directory.Build.props), macOS $macos (macos\scripts\build.sh)."
          }

      - name: Test, build and package
        run: ./windows/scripts/release.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: zalo-switcher-windows
          path: windows/build/release/
          if-no-files-found: error

      - name: Add the files to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem windows\build\release | ForEach-Object FullName

          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            # The usual case: the release with the macOS files exists. Add (or replace) the Windows files.
            gh release upload $env:TAG @files --clobber
            $done = "Added the Windows files to release **$env:TAG**."
          } else {
            # The tag was pushed with no release: a draft, so the notes and macOS files go in before anyone sees it.
            $version = $env:TAG -replace '^v', ''
            gh release create $env:TAG @files --draft --verify-tag --title "Zalo Switcher $version" `
              --notes "Bản Windows: tải **ZaloSwitcher-Setup-$version.exe**."
            $done = "Made draft release **$env:TAG** with the Windows files. Add the notes and the macOS files, then publish it."
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not add the files to the release $env:TAG." }
          $done | Add-Content $env:GITHUB_STEP_SUMMARY
